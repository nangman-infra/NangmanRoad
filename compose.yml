services:
  nangman-road:
    image: "${NANGMAN_ROAD_IMAGE:-harbor.nangman.cloud/library/nangman-road:latest}"
    container_name: nangman-road
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      PORT: "8787"
      # The address the site answers at from outside, which is what the page publishes as
      # its own: the canonical link, og:url, and where a link preview is told to fetch the
      # picture. The private address that stood here is reachable only on this network, so
      # every scraper sent for the preview came back with nothing.
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-https://road.nangman.cloud}"
      # The phrase that asks the search box for what is left of the free tiers instead of
      # measuring. Left empty the route does not exist: the server answers 404 and no
      # deployment but this one has the phrase.
      BUDGET_REPORT_KEY: "${BUDGET_REPORT_KEY:-}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      MEASUREMENT_PROVIDER: "${MEASUREMENT_PROVIDER:-globalping}"
      GLOBALPING_TOKEN: "${GLOBALPING_TOKEN:-}"
      GEOIP_PROVIDER: "${GEOIP_PROVIDER:-ip-api}"
      IP_API_URL: "${IP_API_URL:-http://ip-api.com}"
      IP_API_KEY: "${IP_API_KEY:-}"
      GEOIP_TIMEOUT_MS: "${GEOIP_TIMEOUT_MS:-1400}"
      REVERSE_DNS_TIMEOUT_MS: "${REVERSE_DNS_TIMEOUT_MS:-900}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-8}"
      RATE_LIMIT_PER_HOUR: "${RATE_LIMIT_PER_HOUR:-80}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-900000}"
      FINISHED_SESSION_TTL_MS: "${FINISHED_SESSION_TTL_MS:-120000}"
      MAX_SESSIONS: "${MAX_SESSIONS:-500}"
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || '8787') + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nangman-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=nangman-personal-web"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: nangman-road-watchtower
    command:
      - --http-api-update
      - --cleanup
      - --label-enable
      - --scope
      - nangman-personal-web
      - --interval
      - "0"
      - --api-version
      - "1.44"
    environment:
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_TOKEN:-}"
      WATCHTOWER_SCOPE: "nangman-personal-web"
    ports:
      - "18081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - nangman-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "com.centurylinklabs.watchtower.scope=nangman-personal-web"

networks:
  nangman-network:
    driver: bridge
